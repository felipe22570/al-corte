<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Corte v2 · Inicio de sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#0D1014}
a{color:#3DBE8B}a:hover{color:#6FD4A9}
</style>
</head>
<body>
<div style="box-sizing: border-box; min-height: 760px; padding: 48px 24px; background: #0D1014; color: #F3F5F8; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; align-items: center; justify-content: center">
<main style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">Al Corte</h1><p style="margin: 0; font-size: 15px; color: #AEB7C4">Tus tarjetas, claras antes de cada corte.</p></div>
<form style="background: #151A21; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #AEB7C4">Correo<input type="email" value="tu@correo.com" style="box-sizing: border-box; width: 100%; height: 40px; padding: 0 12px; border: 1px solid #2E3845; border-radius: 9px; background: #0D1014; color: #F3F5F8; font: 400 14px Inter, sans-serif"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #AEB7C4">Contraseña<input type="password" value="contrasena" style="box-sizing: border-box; width: 100%; height: 40px; padding: 0 12px; border: 1px solid #2E3845; border-radius: 9px; background: #0D1014; color: #F3F5F8; font: 400 14px Inter, sans-serif"></label>
<button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: #3DBE8B; color: #06140F; font: 600 14px Inter, sans-serif; cursor: pointer; width: 100%">Ingresar</button>
<a href="login.html" style="font-size: 13px; align-self: center">Enviarme un enlace</a>
</form>
</main>
</div>
</body>
</html>
